# Native splash screens (Android, iOS, web), shown until Flutter draws its
# first frame; LaunchOverlay then continues the same picture in Flutter and
# animates into the app. Images come from tool/generate_brand_assets.dart.
#
#   flutter test tool/generate_brand_assets.dart
#   dart run flutter_native_splash:create --path=flutter_native_splash.yaml
#
# Keep the colours in step with AppColors.splash / splashDark.
flutter_native_splash:
  color: "#2B50E6"
  color_dark: "#1E3CB8"
  image: branding/splash_logo.png
  image_dark: branding/splash_logo.png

  # Android 12+ draws its own splash: same colour, white stopwatch, no
  # icon circle.
  android_12:
    color: "#2B50E6"
    color_dark: "#1E3CB8"
    image: branding/splash_android12.png
    image_dark: branding/splash_android12.png

  android: true
  ios: true
  web: true
  web_image_mode: center
