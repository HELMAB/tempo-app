name: tempo_app
description: "Tempo — offline-first time tracker with projects, weekly goals and reports."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management + dependency injection (ViewModels are Notifiers).
  flutter_riverpod: ^3.4.3
  # Declarative routing with a StatefulShellRoute for the bottom tabs.
  go_router: ^17.5.0
  # Local SQLite (single source of truth for projects and entries).
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  # Small key/value settings (onboarding flag, daily goal, theme...).
  shared_preferences: ^2.5.6
  # Immutable domain models.
  freezed_annotation: ^3.1.0
  intl: ^0.20.2 # pinned by flutter_localizations
  flutter_localizations:
    sdk: flutter
  fl_chart: ^1.2.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  share_plus: ^13.3.1
  file_selector: ^1.1.0
  package_info_plus: ^10.2.2
  flutter_native_splash: ^2.4.8
  flutter_web_plugins:
    sdk: flutter

  # Added later, following the build order in README.md:
  #   fl_chart (Reports), flutter_local_notifications (Settings › Reminders).

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.35.1
  # Stable freezed 4.x needs Dart >=3.13 and freezed 3.x conflicts with
  # drift_dev's analyzer. Move to ^4.0.3 once Flutter ships Dart 3.13.
  freezed: 4.0.0-dev.3
  shared_preferences_platform_interface: ^2.4.2
  meta: ^1.18.0
flutter:
  uses-material-design: true
  # Generates AppLocalizations from lib/l10n/*.arb (see l10n.yaml).
  generate: true

  assets:
    - assets/fonts/OFL.txt

  # Google Sans (Latin + Khmer in one family), bundled so the app never
  # fetches fonts. Static instances from Google Fonts, upright only; the
  # family's heaviest weight is 700.
  fonts:
    - family: Google Sans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700
