name: tempo_app
description: "Tempo — offline-first time tracker with projects, weekly goals and reports."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management + dependency injection (ViewModels are Notifiers).
  flutter_riverpod: ^3.4.3
  # Declarative routing with a StatefulShellRoute for the bottom tabs.
  go_router: ^17.5.0
  # Local SQLite (single source of truth for projects and entries).
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  # Small key/value settings (onboarding flag, daily goal, theme...).
  shared_preferences: ^2.5.6
  # Immutable domain models.
  freezed_annotation: ^3.1.0
  intl: ^0.20.3

  # Added later, following the build order in README.md:
  #   fl_chart (Reports), flutter_local_notifications (Settings › Reminders).

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.35.1
  # Stable freezed 4.x needs Dart >=3.13 and freezed 3.x conflicts with
  # drift_dev's analyzer. Move to ^4.0.3 once Flutter ships Dart 3.13.
  freezed: 4.0.0-dev.3
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL.txt

  # Manrope (handoff typeface), bundled so the app never fetches fonts.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
